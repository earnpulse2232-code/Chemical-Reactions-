<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>Speed Building Test — Chemical Reactions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --green: #10b981;
            --green-light: #ecfdf5;
            --red: #ef4444;
            --red-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100dvh;
            font-size: 15px;
            line-height: 1.5;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }
        .hidden { display: none !important; }

        /* MODE SELECTION SCREEN */
        .start-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .start-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .brand-logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin: 0 auto 16px;
            display: block;
            border-radius: 16px;
        }
        .start-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .start-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            text-align: left;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .mode-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .mode-icon.quiz { background: #dbeafe; color: #2563eb; }
        .mode-icon.test { background: #d1fae5; color: #059669; }
        .mode-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }
        .mode-info-txt {
            font-size: 12px;
            color: var(--text-muted);
        }
        .mode-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* MAIN APP */
        .quiz-app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .quiz-header {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hdr-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .hdr-logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
        }
        .hdr-brand-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-dark);
        }
        .hdr-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            transition: all 0.15s;
        }
        .hdr-btn:hover { background: var(--bg-main); }
        .hdr-timer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        /* QUESTIONS CONTAINER */
        .quiz-main {
            flex: 1;
            overflow-y: auto;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .q-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .q-num-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .lang-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .q-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 22px;
            white-space: pre-line;
        }
        .opts {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .opt:hover:not(.locked) {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .opt.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .opt.correct {
            border-color: var(--green);
            background: var(--green-light);
        }
        .opt.wrong {
            border-color: var(--red);
            background: var(--red-light);
        }
        .opt.locked { cursor: default; }
        .opt-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .opt.selected .opt-letter {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .opt.correct .opt-letter {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }
        .opt.wrong .opt-letter {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .opt-text {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        .opt-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .opt.correct .opt-tag { background: var(--green); color: #fff; }
        .opt.wrong .opt-tag { background: var(--red); color: #fff; }

        .sol-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
        }
        .sol-head {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sol-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        /* BOTTOM NAV */
        .quiz-nav {
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .nav-btn.prev {
            background: #fff;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }
        .nav-btn.prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.submit {
            background: var(--green-light);
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .nav-btn.next {
            background: var(--primary);
            color: #ffffff;
        }
        .nav-btn.next:hover { background: var(--primary-hover); }

        /* PALETTE MODAL */
        .palette-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
        }
        .palette-overlay.open { display: block; }
        .palette-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(340px, 85vw);
            background: #ffffff;
            z-index: 160;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .palette-drawer.open { transform: translateX(0); }
        .pal-head {
            padding: 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 17px;
        }
        .pal-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-content: start;
        }
        .pal-btn {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .pal-btn:hover { transform: scale(1.05); }
        .pal-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
        .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* SUBMIT MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 170;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .modal-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }
        .modal-stat {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
        }
        .modal-stat-num { font-size: 24px; font-weight: 800; color: var(--text-dark); }
        .modal-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn.cancel { background: #f1f5f9; color: var(--text-dark); }

        /* RESULTS SCREEN */
        .results-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 180;
            display: none;
            overflow-y: auto;
            padding: 30px 16px 60px;
        }
        .results-screen.open { display: block; }
        .results-box {
            max-width: 600px;
            margin: 0 auto;
        }
        .res-hero { text-align: center; margin-bottom: 24px; }
        .res-hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .res-score-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        .res-score-val { font-size: 54px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
        .res-score-val span { font-size: 22px; opacity: 0.6; }
        .res-score-lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .res-item {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .res-item-val { font-size: 22px; font-weight: 700; }
        .res-item-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .res-actions { display: flex; flex-direction: column; gap: 10px; }
        .res-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .res-btn.primary { background: var(--primary); color: #fff; }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #0f172a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
            opacity: 0;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- START / MODE SELECT -->
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <img src="logo.png" alt="Quiz Logo" class="brand-logo-img" onerror="this.style.display='none'">
            <h1 class="start-title">Chemical Reactions &amp; Equations</h1>
            <p class="start-desc">Speed Building Test — Choose your mode to begin.</p>
            
            <button class="mode-btn" onclick="startApp('quiz')">
                <div class="mode-icon quiz"><i class="fas fa-bolt"></i></div>
                <div>
                    <div class="mode-name">Practice Mode</div>
                    <div class="mode-info-txt">Instant answer &amp; solution key after each question.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>

            <button class="mode-btn" onclick="startApp('test')">
                <div class="mode-icon test"><i class="fas fa-clock"></i></div>
                <div>
                    <div class="mode-name">Exam Mode</div>
                    <div class="mode-info-txt">Real exam simulation. Detailed score at the end.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="quiz-app hidden" id="quizApp">
        <header class="quiz-header">
            <div class="quiz-header-inner">
                <button class="hdr-btn" onclick="openPalette()"><i class="fas fa-th-large"></i></button>
                <div class="hdr-brand">
                    <img src="logo.png" alt="Logo" class="hdr-logo-img" onerror="this.style.display='none'">
                    <span class="hdr-brand-title">Science Quiz</span>
                </div>
                <div class="hdr-timer">
                    <i class="fas fa-stopwatch"></i>
                    <span id="timerText">00:00</span>
                </div>
            </div>
        </header>

        <main class="quiz-main" id="quizMain"></main>

        <nav class="quiz-nav" id="quizNav">
            <div class="quiz-nav-inner">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button class="nav-btn submit" onclick="openSubmitModal()">
                    <i class="fas fa-paper-plane"></i> Submit
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                    <span id="nextLabel">Next</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </nav>
    </div>

    <!-- QUESTION PALETTE -->
    <div class="palette-overlay" id="paletteOverlay" onclick="closePalette()"></div>
    <aside class="palette-drawer" id="paletteDrawer">
        <div class="pal-head">
            <span>Questions</span>
            <button onclick="closePalette()"><i class="fas fa-times"></i></button>
        </div>
        <div class="pal-grid" id="paletteGrid"></div>
    </aside>

    <!-- SUBMIT CONFIRMATION MODAL -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3 class="modal-title">Submit Test?</h3>
            <div class="modal-stats-grid">
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalAttempted" style="color:var(--green)">0</div>
                    <div class="modal-stat-label">Attempted</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalUnattempted" style="color:var(--text-muted)">0</div>
                    <div class="modal-stat-label">Unattempted</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn confirm" onclick="confirmSubmit()">Yes, Finish Test</button>
                <button class="modal-btn cancel" onclick="closeSubmitModal()">Resume Test</button>
            </div>
        </div>
    </div>

    <!-- FINAL RESULTS SCREEN -->
    <div class="results-screen" id="resultsScreen">
        <div class="results-box" id="resultsInner"></div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check"></i><span id="toastText"></span></div>

    <script>
        const QUESTIONS = [
            {"en": "A chemist keeps calcium carbonate, silver chloride, and lead nitrate exposed to sunlight. Which compound/s show/s a visible change?", "hi": "एक रसायनज्ञ कैल्शियम कार्बोनेट, सिल्वर क्लोराइड और लेड नाइट्रेट को सूर्य के प्रकाश के संपर्क में रखता है। कौन-से यौगिक, दृश्यमान परिवर्तन दर्शाएंगे?", "opts": ["Only lead nitrate / केवल लेड नाइट्रेट", "Only silver chloride / केवल सिल्वर क्लोराइड", "All three compounds / तीनों यौगिक", "Only calcium carbonate / केवल कैल्शियम कार्बोनेट"], "ans": 1},
            {"en": "Which equation correctly represents a displacement reaction involving metals and their salt solutions?", "hi": "कौन-सा समीकरण, धातुओं और उनके लवण विलयनों से शामिल विस्थापन अभिक्रिया को सर्वोत्तम रूप से दर्शाता है?", "opts": ["Cu + ZnSO₄ → CuSO₄ + Zn", "Au + FeSO₄ → AuSO₄ + Fe", "Ag + MgSO₄ → AgSO₄ + Mg", "Zn + CuSO₄ → ZnSO₄ + Cu"], "ans": 3},
            {"en": "When zinc reacts with dilute HCl, the reaction can be classified as:", "hi": "जब जस्ता, तनु HCl के साथ अभिक्रिया करता है, तो इस अभिक्रिया को _______ रूप में वर्गीकृत किया जा सकता है।", "opts": ["Displacement reaction / विस्थापन अभिक्रिया", "Double decomposition reaction / द्वि-अपघटन अभिक्रिया", "Combination reaction / संयोजन अभिक्रिया", "Neutralization reaction / उदासीनीकरण अभिक्रिया"], "ans": 0},
            {"en": "Which condition will slow down rancidity in oily food items ?", "hi": "कौन-सी स्थिति तैलीय खाद्य पदार्थों में विकृतगंधिता को धीमा कर देगी?", "opts": ["Storage in airtight containers flushed with nitrogen / नाइट्रोजन से भरे हुए वायुरोधी पात्रों में भंडारण", "Exposure to sunlight / सूर्य के प्रकाश में रखना", "Presence of moisture / आद्रता की उपस्थिति", "Storage at high temperature / उच्च तापमान पर भंडारण"], "ans": 0},
            {"en": "Consider the reaction: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)\nThis reaction is best classified as which type of chemical reactions?", "hi": "निम्नलिखित अभिक्रिया पर विचार कीजिए: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)\nउपरोक्त अभिक्रिया को किस प्रकार की रासायनिक अभिक्रिया के रूप में सर्वोत्तम तरीके से वर्गीकृत किया जाता है?", "opts": ["Neutralization reaction / उदासीनीकरण अभिक्रिया", "Decomposition reaction / अपघटन (वियोजन) अभिक्रिया", "Combination reaction / संयोजन अभिक्रिया", "Displacement reaction / विस्थापन अभिक्रिया"], "ans": 0},
            {"en": "Calcium carbonate is heated to produce calcium oxide and carbon dioxide; this is a type of:", "hi": "कैल्शियम कार्बोनेट को तप्त करने पर कैल्शियम ऑक्साइड और कार्बन डाइऑक्साइड उत्पन्न होते हैं; यह एक प्रकार की __________ है।", "opts": ["substitution reaction / प्रतिस्थापन अभिक्रिया", "addition reaction / योगज अभिक्रिया", "decomposition reaction / अपघटन अभिक्रिया", "displacement reaction / विस्थापन अभिक्रिया"], "ans": 2},
            {"en": "Consider the reaction:\nNa₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2NaCl(aq)\nWhich feature of this reaction justifies classifying it specifically as a precipitation reaction?", "hi": "निम्नलिखित अभिक्रिया पर विचार कीजिए:\nNa₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2NaCl(aq)\nउपरोक्त अभिक्रिया की कौन-सी विशेषता इसे विशेष रूप से अवक्षेपण अभिक्रिया के रूप में वर्गीकृत करने को उचित ठहराती है?", "opts": ["Reactants exist initially as aqueous solutions / अभिक्रियक (Reactants) प्रारंभ में जलीय विलयन के रूप में मौजूद होते हैं", "Insoluble barium sulphate forms in solution / विलयन में अघुलनशील बेरियम सल्फेट का निर्माण होता है", "Sodium chloride remains dissolved in water / सोडियम क्लोराइड, जल में विलीन बना रहता है", "Two ionic compounds exchange partners / दो आयनिक यौगिक भागीदारों (partners) का विनिमय करते हैं"], "ans": 1},
            {"en": "Consider the following reactions:\n(I) Na₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2NaCl(aq)\n(II) AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)\n(III) CaCO₃(s) —Heat→ CaO(s) + CO₂(g)\n(IV) Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s)\nWhich of the above reactions are precipitation reactions?", "hi": "निम्नलिखित अभिक्रियाओं पर विचार कीजिए:\n(I) Na₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2NaCl(aq)\n(II) AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)\n(III) CaCO₃(s) —Heat→ CaO(s) + CO₂(g)\n(IV) Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s)\nउपरोक्त में से कौन-सी अभिक्रियाएं, अवक्षेपण अभिक्रियाएं हैं?", "opts": ["Only I and III / केवल I और III", "Only III and IV / केवल III और IV", "Only I and II / केवल I और II", "Only II and IV / केवल II और IV"], "ans": 2},
            {"en": "Which observation best demonstrates that reduction has occurred in a chemical reaction?", "hi": "निम्नलिखित में से कौन-सा अवलोकन सर्वोत्तम तरीके से यह दर्शाता है कि रासायनिक अभिक्रिया में अपचयन हुआ है?", "opts": ["Oxygen is removed from a metal oxide during heating. / तापन के दौरान धात्विक ऑक्साइड से ऑक्सीजन निष्कासत हो जाती है", "Hydrogen gas is evolved after metal reacts with acid. / अम्ल के साथ धातु की अभिक्रिया के बाद हाइड्रोजन गैस उत्सर्जित होती है", "Oxygen combines with a metal to form its oxide layer. / ऑक्सीजन, धातु के साथ अभिक्रिया करके ऑक्साइड की परत बनाती है", "Carbon dioxide is released after heating a carbonate salt. / कार्बोनेट लवण को तप्त करने पर कार्बन डाइऑक्साइड विमुक्त होती है"], "ans": 0},
            {"en": "In the reaction MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂, which substance is oxidized?", "hi": "अभिक्रिया MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂ में, कौन-सा पदार्थ ऑक्सीकृत होता है?", "opts": ["MnCl₂", "H₂O", "HCl", "MnO₂"], "ans": 2},
            {"en": "Which observation would show a violation of the law of conservation of mass in a closed system?", "hi": "निम्नलिखित में से कौन-सा अवलोकन संवृत निकाय में द्रव्यमान संरक्षण के नियम के उल्लंघन को दर्शाता है?", "opts": ["The color of the solution changes after reaction / अभिक्रिया के बाद विलयन का रंग परिवर्तित हो जाता है", "A white precipitate forms after mixing solutions / विलयनों के मिश्रण के बाद एक श्वेत अवक्षेप बनता है", "The temperature of the system increases / निकाय के तापमान में वृद्धि होती है", "The mass of the products is less than the mass of the reactants / उत्पादों का द्रव्यमान, अभिकारकों के द्रव्यमान से कम होता है"], "ans": 3},
            {"en": "When hydrochloric acid reacts with sodium hydroxide to form sodium chloride and water, which type of reaction is primarily demonstrated?", "hi": "जब हाइड्रोक्लोरिक अम्ल, सोडियम हाइड्रॉक्साइड के साथ अभिक्रिया करके सोडियम क्लोराइड और जल बनाता है, तो मुख्य रूप से किस प्रकार की अभिक्रिया प्रदर्शित होती है?", "opts": ["Displacement reaction / विस्थापन अभिक्रिया", "Combination reaction / संयोजन अभिक्रिया", "Double displacement reaction / द्वि-विस्थापन अभिक्रिया", "Redox reaction / रेडॉक्स अभिक्रिया"], "ans": 2},
            {"en": "Which visible change confirms displacement reaction when iron reacts with copper sulphate solution?", "hi": "जब आयरन, कॉपर सल्फेट विलयन के साथ अभिक्रिया करता है, तो कौन-सा दृश्य परिवर्तन विस्थापन अभिक्रिया की पुष्टि करता है?", "opts": ["Solution temperature drops suddenly / विलयन का तापमान अचानक गिरता है", "Colourless gas evolves rapidly / रंगहीन गैस तेजी से विकसित होती है", "Reddish-brown copper deposits appear / लाल-भूरा कॉपर निक्षेप दिखाई देता है", "White precipitate forms instantly / तुरंत सफेद अवक्षेप बनता है"], "ans": 2},
            {"en": "When carbon dioxide gas is passed through lime water (calcium hydroxide solution), it produces a white precipitate which is of:", "hi": "जब कार्बन डाइऑक्साइड गैस को चूने के पानी (कैल्शियम हाइड्रॉक्साइड विलयन) से गुजारा जाता है, तो यह _____________ का श्वेत अवक्षेप उत्‍‍पन्‍न करता है।", "opts": ["calcium carbonate / कैल्शियम कार्बोनेट", "calcium oxide / कैल्शियम ऑक्साइड", "calcium hydrogen carbonate / कैल्शियम हाइड्रोजन कार्बोनेट", "calcium sulphate / कैल्शियम सल्फेट"], "ans": 0},
            {"en": "What primary factor determines whether one element can displace another from its compound?", "hi": "निम्नलिखित में से कौन-सा प्राथमिक कारक यह निर्धारित करता है कि एक तत्व दूसरे तत्व को उसके यौगिक से विस्थापित कर सकता है?", "opts": ["Difference in solution concentration / विलयन सांद्रता में अंतर", "Relative reactivity of the elements involved / संबंधित तत्वों की सापेक्षिक अभिक्रियाशीलता", "Difference in physical state / भौतिक अवस्था में अंतर", "Difference in atomic masses / परमाण्विक द्रव्यमानों में अंतर"], "ans": 1},
            {"en": "What is the main characteristic of a double displacement reaction?", "hi": "द्वि-विस्थापन अभिक्रिया का मुख्य अभिलक्षण क्या है?", "opts": ["Gain of oxygen by a substance / किसी पदार्थ को ऑक्सीजन का लाभ", "Removal of hydrogen from acid / अम्ल से हाइड्रोजन का निष्कासन", "Combination of two elements / दो तत्वों का संयोजन", "Exchange of ions between reactants / अभिकारकों के बीच आयनों का विनिमय"], "ans": 3},
            {"en": "Which change correctly represents oxidation in a chemical reaction?", "hi": "निम्नलिखित में से कौन-सा परिवर्तन, रासायनिक अभिक्रिया में ऑक्सीकरण को सही से निरूपित करता है?", "opts": ["Exchange of ions between compounds / यौगिकों के बीच आयनों का विनिमय", "Formation of salt and water / लवण और जल का निर्माण", "Addition of oxygen to a substance / किसी पदार्थ में ऑक्सीजन का योग", "Removal of oxygen from a compound / किसी यौगिक से ऑक्सीजन का निष्कासन"], "ans": 2},
            {"en": "Why is the reaction flask corked during experiments verifying conservation of mass?", "hi": "द्रव्यमान संरक्षण को सत्यापित करने वाले प्रयोगों के दौरान अभिक्रिया फ्लास्क को कॉर्क क्यों किया जाता है?", "opts": ["To increase reaction speed / अभिक्रिया के वेग में वृद्धि करने के लिए", "To allow air circulation / वायु परिसंचरण को संभव करने के लिए", "To cool reaction mixture / अभिक्रिया मिश्रण को शीतल करने के लिए", "To prevent loss of matter / पदार्थ की हानि को रोकने के लिए"], "ans": 3},
            {"en": "What chemical change best indicates oxidation of a substance during a chemical reaction?", "hi": "निम्नलिखित में से कौन-सा रासायनिक परिवर्तन, किसी रासायनिक अभिक्रिया के दौरान पदार्थ के ऑक्सीकरण को सर्वोत्तम रूप से इंगित करता है?", "opts": ["Gain of hydrogen only / केवल हाइड्रोजन का लाभ", "Loss of electrons only / केवल इलेक्ट्रॉनों की हानि", "Gain of oxygen or loss of hydrogen / ऑक्सीजन का लाभ या हाइड्रोजन की हानि", "Change in physical state / भौतिक अवस्था में परिवर्तन"], "ans": 2},
            {"en": "Consider the reaction:\nZnO(s) + C(s) → Zn(s) + CO(g)\nWhich of the following correctly identifies the substance undergoing reduction in this reaction?", "hi": "निम्नलिखित अभिक्रिया पर विचार कीजिएः\nZnO(s) + C(s) → Zn(s) + CO(g)\nइस अभिक्रिया में उस पदार्थ की सही पहचान कीजिए जिसका अपचयन होता है?", "opts": ["ZnO loses oxygen forming Zn / ZnO, ऑक्सीजन का त्यागकर Zn बनाता है", "Carbon gains oxygen forming CO / कार्बन, ऑक्सीजन ग्रहण करके CO बनाता है", "CO produced during oxidation / ऑक्सीकरण के दौरान CO उत्पन्न होती है", "ZnO converted into zinc metal / ZnO, जिंक धातु में परिवर्तित होता है"], "ans": 0},
